[project]
name = "catan-strategy-comparison"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "catanatron==3.2.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "jupyter",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
